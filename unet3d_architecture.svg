<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>3D U-Net architecture</title>
<desc>An input MRI volume passes through three shrinking encoder blocks, a bottleneck, then three growing decoder blocks back to an output segmentation map, with skip connections copying detail from each encoder block to its matching decoder block.</desc>

<rect width="680" height="900" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Input -->
<g>
<rect x="240" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Input volume</text>
<text x="340" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">4 modalities, 96x96x96</text>
</g>

<!-- Encoder 1 -->
<g>
<rect x="240" y="136" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Encoder block 1</text>
<text x="340" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">32 channels, downsample</text>
</g>

<!-- Encoder 2 -->
<g>
<rect x="240" y="232" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Encoder block 2</text>
<text x="340" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">64 channels, downsample</text>
</g>

<!-- Encoder 3 -->
<g>
<rect x="240" y="328" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Encoder block 3</text>
<text x="340" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">128 channels, downsample</text>
</g>

<!-- Bottleneck -->
<g>
<rect x="240" y="424" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Bottleneck</text>
<text x="340" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">256 channels</text>
</g>

<!-- Decoder 3 -->
<g>
<rect x="240" y="520" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="340" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Decoder block 3</text>
<text x="340" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">128 channels, upsample</text>
</g>

<!-- Decoder 2 -->
<g>
<rect x="240" y="616" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="340" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Decoder block 2</text>
<text x="340" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">64 channels, upsample</text>
</g>

<!-- Decoder 1 -->
<g>
<rect x="240" y="712" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="340" y="732" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Decoder block 1</text>
<text x="340" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">32 channels, upsample</text>
</g>

<!-- Output -->
<g>
<rect x="240" y="808" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="828" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Output map</text>
<text x="340" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">4-class segmentation</text>
</g>

<!-- Main chain arrows -->
<line x1="340" y1="96" x2="340" y2="136" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="340" y2="232" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="288" x2="340" y2="328" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="384" x2="340" y2="424" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="480" x2="340" y2="520" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="576" x2="340" y2="616" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="672" x2="340" y2="712" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="768" x2="340" y2="808" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Skip connections -->
<path d="M440,164 C520,164 520,740 440,740" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>
<path d="M440,260 C500,260 500,644 440,644" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>
<path d="M440,356 C480,356 480,548 440,548" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>

<!-- Legend -->
<g font-family="Arial, sans-serif" font-size="11" fill="#333333">
<line x1="490" y1="885" x2="510" y2="885" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="516" y="889">Skip connection (copies detail)</text>
</g>

</svg>
